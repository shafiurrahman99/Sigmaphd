<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Sigma PhD - Super Admin Portal (admin.html)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style id="dynamicStyleContainer"></style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Tier 1 Login & App Shell -->
    <div id="appShell" class="w-full max-w-4xl bg-slate-900 border border-purple-500/50 rounded-3xl p-6 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-4">
            <div>
                <h1 class="text-base font-extrabold text-purple-400"><i class="fa-solid fa-crown mr-2"></i>Tier 1: Super Admin Master Control</h1>
                <p class="text-[11px] text-slate-400">Database Vault & Global Feature Gatekeeper</p>
            </div>
            <button onclick="logoutAdmin()" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl shadow">Log Out</button>
        </div>
        
        <div class="space-y-3 text-xs">
            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800">
                <h3 class="font-bold text-amber-300 mb-1">Database Schema Mapping:</h3>
                <p class="font-mono text-slate-400">company_id | secret_pass | layout_settings | app_state_vault</p>
            </div>
        </div>
    </div>

    <!-- Dynamic JS Injection Engine -->
    <script>
        // ডেটাবেজ থেকে 'interfacebuttonlogic_js' বা 'databasefacing_js' এখানে পুশ হবে
        function injectDynamicScript(jsCode) {
            let script = document.createElement('script');
            script.text = jsCode;
            document.body.appendChild(script);
        }
        function logoutAdmin() {
            alert('Admin Logged Out Successfully');
            window.location.href = 'admin.html';
        }
    </script>
</body>
</html>
