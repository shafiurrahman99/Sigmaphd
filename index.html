<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-src 'self'; object-src 'none'; base-uri 'self';">
    <title>My Develop App - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: '#07090d',
                        cardBg: '#131822',
                        innerDark: '#080a0f',
                        accentGreen: '#0fa968',
                        accentOrange: '#f59e0b',
                    },
                    fontFamily: {
                        sans: ['Inter', 'Hind Siliguri', 'sans-serif'],
                        bengali: ['Hind Siliguri', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', 'Hind Siliguri', sans-serif;
            background-color: #07090d;
            color: #e2e8f0;
            user-select: none;
        }
        .gradient-text {
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .buy-btn-gradient {
            background: linear-gradient(90deg, #f59e0b 0%, #f43f5e 50%, #ec4899 100%);
            transition: all 0.3s ease;
        }
        .buy-btn-gradient:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 10px; }
        #accountsFrame {
            width: 100%;
            min-height: 76px;
            border: 0;
            border-radius: 1.25rem;
            background: transparent;
            display: block;
        }
        #dashboardFrame {
            width: 100%;
            min-height: 780px;
            border: 0;
            border-radius: 1.25rem;
            background: transparent;
            display: block;
        }
        @media print {
            body * { visibility: hidden; }
            #a4MemoPrintArea, #a4MemoPrintArea * { visibility: visible; }
            #a4MemoPrintArea {
                position: fixed; left: 0; top: 0; width: 210mm; min-height: 297mm;
                margin: 0; padding: 15mm; background: white !important; color: black !important; box-shadow: none !important; z-index: 9999;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-2 sm:p-4 bg-slate-950">

    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-[120] w-11/12 max-w-md bg-emerald-600 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center justify-between text-sm font-medium transition-all duration-300">
        <span id="toast-text">Action successful!</span>
        <button type="button" onclick="hideToast()" class="text-white hover:text-emerald-200 ml-2">
            <i class="fa-solid fa-xmark text-base"></i>
        </button>
    </div>

    <!-- ================= PAGE 1: LOGIN & LANDING ================= -->
    <div id="page1" class="w-full max-w-md mx-auto space-y-4 my-auto py-4">
        <div class="bg-[#131822] rounded-3xl p-5 sm:p-6 shadow-2xl border border-slate-800/80 relative overflow-hidden">
            <div class="flex items-start justify-between mb-5">
                <div>
                    <h1 class="text-2xl font-extrabold text-white tracking-tight">My Personal ERP</h1>
                    <p class="font-bengali text-emerald-400 font-semibold text-sm mt-0.5 tracking-wide"></p>
                </div>
                <div class="text-right">
                    <span class="gradient-text font-black text-lg italic tracking-wider block">Sigma PhD™</span>
                </div>
            </div>

            <form onsubmit="handleMainSignIn(event)" class="space-y-4" autocomplete="off">
                <div>
                    <input type="text" id="mainUserName" required maxlength="64" pattern="[A-Za-z0-9_@.-]+" autocomplete="username" placeholder="Enter Username"
                        class="w-full bg-[#080a0f] border border-slate-700/60 rounded-2xl py-3 px-4 text-emerald-400 font-medium tracking-wide focus:outline-none focus:border-emerald-500 transition-all text-sm">
                </div>
                <div>
                    <input type="password" id="mainUserPassword" required minlength="4" maxlength="128" autocomplete="current-password" placeholder="Enter Password"
                        class="w-full bg-[#080a0f] border border-slate-700/60 rounded-2xl py-3 px-4 text-emerald-400 font-medium tracking-widest focus:outline-none focus:border-emerald-500 transition-all text-sm">
                </div>

                <button type="submit"
                    class="w-full bg-[#0fa968] hover:bg-[#0c8e57] text-slate-950 font-bold py-3.5 px-4 rounded-2xl flex items-center justify-center space-x-2 transition-all active:scale-95 shadow-lg shadow-emerald-900/20 text-base mt-2">
                    <span>Sign In</span>
                    <i class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </form>

            <div class="my-4 border-t border-slate-800"></div>

            <button type="button" onclick="openBuyLicenseLandingModal()"
                class="w-full buy-btn-gradient text-slate-950 font-extrabold py-3.5 px-4 rounded-2xl flex items-center justify-center space-x-2 shadow-lg active:scale-95 text-base">
                <i class="fa-solid fa-credit-card text-base text-slate-900"></i>
                <span>Buy New ID</span>
            </button>
        </div>
    </div>

    <!-- ================= PAGE 2: HOME SHELL ================= -->
    <div id="page2" class="hidden w-full max-w-3xl mx-auto space-y-4 py-2">
        <span id="currentLoggedInUser" class="hidden"></span>

        <!-- Accounts Module (accounts.html) -->
        <div id="accountsIframeSection" class="bg-[#131822]/70 border border-slate-800/80 rounded-3xl p-1.5 sm:p-2 shadow-2xl overflow-hidden">
            <iframe
                id="accountsFrame"
                src="accounts.html"
                title="User Account & Devices"
                sandbox="allow-scripts allow-same-origin allow-forms"
                loading="eager"></iframe>
        </div>

        <!-- Navigation Tabs Bar -->
        <div class="bg-[#131822] border border-slate-800/80 rounded-2xl p-2 shadow-xl">
            <div class="grid grid-cols-3 gap-1 text-xs">
                <button type="button" onclick="setDashboardFrameTab('dashboard')" class="bg-emerald-600 text-white font-bold py-2 rounded-xl text-center shadow-md">Dashboard</button>
                <button type="button" onclick="openMyChatModal()" class="bg-[#1a2130] hover:bg-slate-800 text-slate-300 font-medium py-2 rounded-xl text-center border border-slate-700/50">My Chat</button>
                <button type="button" onclick="openCashMemoModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-xl text-center shadow-md flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-receipt"></i>
                    <span>Cash Memo</span>

            </div>
        </div>

        <!-- Dashboard Module (dashboard.html) -->
        <div id="dashboardIframeSection" class="bg-[#131822]/70 border border-slate-800/80 rounded-3xl p-1.5 sm:p-2 shadow-2xl overflow-hidden">
            <iframe

        <div class="bg-[#131822] border border-slate-700 w-full max-w-sm rounded-3xl p-5 shadow-2xl relative space-y-3 text-xs">
            <button type="button" onclick="closeBuyLicenseLandingModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-base font-bold text-white">Buy New ID / License</h3>

            <form onsubmit="handleLandingBuySubmit(event)" class="space-y-2.5">
                <div>
                    <label class="block text-slate-400 mb-1">Buyer Name</label>
                    <input type="text" id="landingBuyerName" maxlength="100" placeholder="Full Name" required class="w-full bg-[#080a0f] border border-slate-700 rounded-xl py-2 px-3 text-slate-200">
                </div>

                    <label class="block text-slate-400 mb-1">Mobile Number</label>

                </div>

                    <label class="block text-slate-400 mb-1">Email Address</label>
                    <input type="email" id="landingBuyEmail" maxlength="120" placeholder="email@domain.com" required class="w-full bg-[#080a0f] border border-slate-700 rounded-xl py-2 px-3 text-slate-200">

                <div>
                    <label class="block text-slate-400 mb-1">Payment TrxID</label>

                    <h3 id="chatModalTitle" class="text-sm sm:text-base font-bold text-white flex items-center space-x-2">

                    <div class="relative">

                    <span class="text-indigo-300 font-semibold flex items-center space-x-1.5">

                        <span>Send</span>

                <button type="button" onclick="saveMemoToDevice()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-5 rounded-xl text-xs flex items-center space-x-1.5 shadow">

    <!-- Hidden A4 Print Area -->
    <div id="a4MemoPrintArea" class="hidden"></div>

    <!-- Parent Bridge Controller (Parent <-> accounts.html & dashboard.html) -->
    <script>
        (function initParentIframeBridge() {
            const CHANNEL = 'SIGMAPHD_DASHBOARD_BRIDGE';
            const accountsFrame = document.getElementById('accountsFrame');
            const dashboardFrame = document.getElementById('dashboardFrame');
            let activeScopeKey = '101_admin';

            function sanitizeIdentifier(raw) {
                if (typeof raw !== 'string') return '';
                return raw.replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 64);
            }

            function getActiveScopeKey() {
                const userEl = document.getElementById('currentLoggedInUser');
                const cleanUser = sanitizeIdentifier(userEl && userEl.textContent ? userEl.textContent.trim() : '');
                if (activeScopeKey && activeScopeKey !== '101_admin') {
                    return activeScopeKey;
                }
                return cleanUser ? `101_${cleanUser}` : '101_admin';
            }

            function postToFrame(frameEl, type, payload = {}) {
                if (!frameEl || !frameEl.contentWindow) return;
                frameEl.contentWindow.postMessage({
                    channel: CHANNEL,
                    type,
                    scopeKey: getActiveScopeKey(),
                    payload
                }, window.location.origin);
            }

            window.syncDashboardIframeUser = function syncDashboardIframeUser(scopeKey) {
                const cleanKey = sanitizeIdentifier(scopeKey);
                if (cleanKey) {
                    activeScopeKey = cleanKey;
                }
                if (dashboardFrame) {
                    const currentSrc = dashboardFrame.getAttribute('src') || '';
                    if (!currentSrc.startsWith('dashboard.html')) {
                        dashboardFrame.setAttribute('src', 'dashboard.html');
                    }
                    postToFrame(dashboardFrame, 'SET_USER_SCOPE', { scopeKey: getActiveScopeKey() });
                }
                if (accountsFrame) {
                    const currentAccSrc = accountsFrame.getAttribute('src') || '';
                    if (!currentAccSrc.startsWith('accounts.html')) {
                        accountsFrame.setAttribute('src', 'accounts.html');
                    }
                    postToFrame(accountsFrame, 'SET_USER_SCOPE', { scopeKey: getActiveScopeKey() });
                }
            };

            window.setDashboardFrameTab = function setDashboardFrameTab(tabName) {
                const allowedTabs = ['dashboard', 'ledger', 'reports', 'loans'];
                const safeTab = allowedTabs.includes(tabName) ? tabName : 'dashboard';
                postToFrame(dashboardFrame, 'SWITCH_TAB', { tab: safeTab });
            };

            [accountsFrame, dashboardFrame].forEach((frameEl) => {
                if (!frameEl) return;
                frameEl.addEventListener('load', () => {
                    postToFrame(frameEl, 'SET_USER_SCOPE', { scopeKey: getActiveScopeKey() });
                    postToFrame(frameEl, 'REQUEST_HEIGHT');
                });
            });

            window.addEventListener('message', (event) => {
                if (!event.origin || event.origin !== window.location.origin) {
                    return;
                }
                const isFromAccounts = Boolean(accountsFrame && event.source === accountsFrame.contentWindow);
                const isFromDashboard = Boolean(dashboardFrame && event.source === dashboardFrame.contentWindow);
                if (!isFromAccounts && !isFromDashboard) {
                    return;
                }

                const data = event.data;
                if (!data || data.channel !== CHANNEL) return;

                if (data.type === 'FRAME_HEIGHT' && typeof data.height === 'number' && Number.isFinite(data.height)) {
                    const targetFrame = isFromAccounts ? accountsFrame : dashboardFrame;
                    const minH = isFromAccounts ? 74 : 520;
                    const safeHeight = Math.min(4000, Math.max(minH, Math.ceil(data.height) + 16));
                    if (targetFrame) targetFrame.style.height = `${safeHeight}px`;
                } else if (data.type === 'TOAST' && typeof window.showToast === 'function') {
                    const safeMsg = typeof data.message === 'string' ? data.message.slice(0, 200) : 'Updated';
                    const allowedVariants = ['success', 'error', 'warning', 'info', 'warn'];
                    const safeVariant = allowedVariants.includes(data.variant) ? data.variant : 'success';
                    window.showToast(safeMsg, safeVariant);
                } else if (data.type === 'OPEN_MODAL') {
                    if (data.modal === 'chat' && typeof window.openMyChatModal === 'function') window.openMyChatModal();
                    if (data.modal === 'memo' && typeof window.openCashMemoModal === 'function') window.openCashMemoModal();
                } else if (data.type === 'REQUEST_USER_SCOPE') {
                    const targetFrame = isFromAccounts ? accountsFrame : dashboardFrame;
                    postToFrame(targetFrame, 'SET_USER_SCOPE', { scopeKey: getActiveScopeKey() });
                } else if (data.type === 'LOGOUT' && typeof window.handleLogOut === 'function') {
                    window.handleLogOut();
                } else if (data.type === 'ACCOUNTS_STATE_UPDATED' && isFromAccounts) {
                    postToFrame(dashboardFrame, 'REQUEST_HEIGHT');
                }
            });

            const userEl = document.getElementById('currentLoggedInUser');
            if (userEl && typeof MutationObserver !== 'undefined') {
                new MutationObserver(() => {
                    const cleanUser = sanitizeIdentifier(userEl.textContent ? userEl.textContent.trim() : '');
                    activeScopeKey = cleanUser ? `101_${cleanUser}` : '101_admin';
                    postToFrame(dashboardFrame, 'SET_USER_SCOPE', { scopeKey: getActiveScopeKey() });
                    postToFrame(accountsFrame, 'SET_USER_SCOPE', { scopeKey: getActiveScopeKey() });
                }).observe(userEl, { childList: true, characterData: true, subtree: true });
            }
        })();
    </script>

    <script src="script.js"></script>
</body>
</html>
