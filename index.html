<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma PhD - Central Universal Gateway Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #064e3b 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md p-8 bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl relative overflow-hidden">
        
        <!-- Header Title -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-emerald-400 flex items-center justify-center gap-2">
                <i class="fa-solid fa-shield-halved"></i> Sigma Ph D ™
            </h1>
            <p class="text-xs text-slate-400 mt-1">Central Universal Gateway Portal</p>
        </div>

        <!-- Error / Status Message Box -->
        <div id="error-box" class="hidden mb-4 p-3 text-xs text-rose-300 bg-rose-950/60 border border-rose-800/60 rounded-xl text-center font-medium transition-all">
            <!-- Dynamic Error Message -->
        </div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <input type="text" id="admin_id" required placeholder="System ID / Admin ID" 
                    class="w-full px-4 py-3 bg-slate-800/70 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-sm">
            </div>

            <div>
                <input type="password" id="password" required placeholder="Credential Password" 
                    class="w-full px-4 py-3 bg-slate-800/70 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-sm">
            </div>

            <button type="submit" id="auth-btn"
                class="w-full py-3 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold rounded-xl shadow-lg shadow-emerald-900/30 transition-all duration-200 text-sm flex items-center justify-center gap-2">
                <span>Authenticate</span>
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <!-- Footer Domain Note -->
        <div class="text-center mt-6">
            <span class="text-[11px] text-slate-500 tracking-wider">sigmaphd.vercel.app</span>
        </div>
    </div>

    <!-- Secure Authentication Script -->
    <script>
        async function handleLogin(event) {
            event.preventDefault();
            
            const adminIdInput = document.getElementById('admin_id').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const errorBox = document.getElementById('error-box');
            const authBtn = document.getElementById('auth-btn');

            // Reset Error Box
            errorBox.classList.add('hidden');
            errorBox.textContent = '';
            
            // Loading State
            authBtn.disabled = true;
            authBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...`;

            try {
                const response = await fetch('/api/secure-proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        action: 'verify_admin', 
                        payload: { admin_id: adminIdInput, password: passwordInput } 
                    })
                });

                const rawText = await response.text();
                let result;
                
                try {
                    result = JSON.parse(rawText);
                } catch (e) {
                    console.error("Non-JSON Response:", rawText);
                    throw new Error("Invalid Server Response (Not JSON)");
                }

                if (!result.success) {
                    throw new Error(result.error || "Authentication failed!");
                }

                // Success Action (Redirect or Load Dashboard)
                authBtn.innerHTML = `<i class="fa-solid fa-check"></i> Success!`;
                authBtn.classList.remove('from-emerald-600', 'to-teal-600');
                authBtn.classList.add('from-emerald-500', 'to-green-600');
                
                setTimeout(() => {
                    alert("Login Successful! Welcome, " + result.data.admin_id);
                    // location.href = '/dashboard.html'; // ড্যাশবোর্ড পেজ থাকলে রিডাইরেক্ট করতে পারেন
                }, 500);

            } catch (err) {
                console.error("Login Error:", err);
                errorBox.textContent = "✕ " + err.message;
                errorBox.classList.remove('hidden');
                
                // Reset Button
                authBtn.disabled = false;
                authBtn.innerHTML = `<span>Authenticate</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>`;
            }
        }
    </script>
</body>
</html>
