<script>
    // --- ১. সুপার এডমিন লগইন (Secure Proxy এর মাধ্যমে) ---
    async function handleSuperAdminLogin(e) {
        e.preventDefault();
        const id = document.getElementById('superAdminId').value.trim();
        const pass = document.getElementById('superAdminPass').value.trim();
        const errBox = document.getElementById('adminLoginError');
        const submitBtn = document.getElementById('superAdminLoginBtn');
        
        if(errBox) errBox.classList.add('hidden');
        if(submitBtn) {
            submitBtn.innerText = "প্রক্সি সার্ভারে যাচাই চলছে...";
            submitBtn.disabled = true;
        }

        try {
            const response = await fetch('/api/secure-proxy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'verify_admin',
                    payload: { admin_id: id, password: pass }
                })
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.error || "ভুল সুপার এডমিন আইডি বা পাসওয়ার্ড!");
            }

            document.getElementById('superAdminLoginView').classList.add('hidden');
            document.getElementById('superAdminDashboard').classList.remove('hidden');
            switchAdminNav('registerForm');

        } catch(ex) {
            if(errBox) {
                errBox.innerText = ex.message || "লগইন ব্যর্থ হয়েছে!";
                errBox.classList.remove('hidden');
            }
        } finally {
            if(submitBtn) {
                submitBtn.innerText = "লগইন করুন";
                submitBtn.disabled = false;
            }
        }
    }

    // --- ২. কোম্পানি লগইন (Secure Proxy এর মাধ্যমে) ---
    async function handleCompanyLogin(e) {
        e.preventDefault();
        const compIdInput = document.getElementById('loginCompanyId').value.trim();
        const compPass = document.getElementById('loginCompanyPass').value.trim();
        const errBox = document.getElementById('companyLoginError');
        const submitBtn = document.getElementById('companyLoginBtn');
        
        errBox.classList.add('hidden');
        submitBtn.innerText = "প্রক্সি সার্ভারের মাধ্যমে চেক করা হচ্ছে...";
        submitBtn.disabled = true;

        try {
            const compId = parseInt(compIdInput);
            const response = await fetch('/api/secure-proxy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'get_company',
                    payload: { company_id: compId }
                })
            });

            const result = await response.json();

            if (!response.ok || !result.success || !result.data) {
                showCompanyError(result.error || "কোম্পানি আইডি পাওয়া যায়নি!");
                return;
            }

            if (String(result.data.secret_pass).trim() !== String(compPass).trim()) {
                showCompanyError("সিক্রেট পাসওয়ার্ড ভুল হয়েছে!");
                return;
            }

            showCompanyError("লগইন সফল! অ্যাপ রেন্ডার করা হচ্ছে...");

        } catch (err) {
            showCompanyError("പ്രক্সি সার্ভার সংযোগে সমস্যা হয়েছে।");
        } finally {
            submitBtn.innerText = "লগইন ও অ্যাপ রেন্ডার করুন";
            submitBtn.disabled = false;
        }
    }

    function showCompanyError(msg) {
        const errBox = document.getElementById('companyLoginError');
        errBox.innerText = msg;
        errBox.classList.remove('hidden');
    }

    function handleAdminLogout() {
        document.getElementById('superAdminDashboard').classList.add('hidden');
        document.getElementById('superAdminLoginView').classList.remove('hidden');
    }

    function switchAdminNav(target) {
        document.getElementById('tabRegisterForm').classList.add('hidden');
        document.getElementById('tabCompanyList').classList.add('hidden');
        document.getElementById('tabSqlConsole').classList.add('hidden');

        if (target === 'registerForm') {
            document.getElementById('tabRegisterForm').classList.remove('hidden');
            document.getElementById('radioReg').checked = true;
        } else if (target === 'companyList') {
            document.getElementById('tabCompanyList').classList.remove('hidden');
            document.getElementById('radioList').checked = true;
        } else if (target === 'sqlConsole') {
            document.getElementById('tabSqlConsole').classList.remove('hidden');
            document.getElementById('radioSql').checked = true;
        }
    }
</script>
