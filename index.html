
    <!DOCTYPE html>
<html lang="bn">


<script>
        const PROXY_API_URL = "/api/root-proxy";

        // গ্লোবাল ভেরিয়েবলসমূহ ডিক্লেয়ার করা হলো
        let GLOBAL_COMPANY_ID = "105";
        let currentUserId = "";
        let currentCompositeUserId = "";
        let currentWalletBalance = 0;
        let currentValidityDays = 0;

        let totalIncome2026 = 0;
        let totalExpense2026 = 0;
        let marketExpenses = [];
        let loanGivenRecords = [];
        let loanTakenRecords = [];
        let loanGivenTotal = 0;
        let loanTakenTotal = 0;

        async function callServerProxy(action, payload) {
            try {
                const response = await fetch(PROXY_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: action,
                        company_id: GLOBAL_COMPANY_ID,
                        user_id: currentUserId,
                        composite_user_id: currentCompositeUserId,
                        payload: payload
                    })
                });
                const result = await response.json();
                return result;
            } catch (error) {
                console.error("Proxy Request Error:", error);
                return { success: false, error: error.message };
            }
        }

        // --- ডাইরেক্ট ডাটাবেজ থেকে ডাটা ফেচিং ফাংশন ---
        async function fetchDashboardDataFromDB() {
            showToast('ডাটাবেজ থেকে ডেটা সিঙ্ক করা হচ্ছে...');
            const result = await callServerProxy('FETCH_DASHBOARD_DATA', {});
            
            if (result.success && result.data) {
                const dbData = result.data;

                // 1. Daily Expenses & Income Mapping
                marketExpenses = [];
                totalExpense2026 = 0;
                totalIncome2026 = 0;

                if (dbData.daily_expenses) {
                    dbData.daily_expenses.forEach(item => {
                        marketExpenses.push({
                            id: item.id,
                            date: item.expense_date,
                            desc: item.description,
                            amount: Number(item.amount),
                            status: item.status
                        });
                        totalExpense2026 += Number(item.amount);
                    });
                }

                // Income / Expense টেবিল থেকে হিসাব করা
                if (dbData.income_expense) {
                    dbData.income_expense.forEach(item => {
                        const amt = Number(item.amount);
                        if (item.entry_type === 'Income') {
                            totalIncome2026 += amt;
                        } else if (item.entry_type === 'Expense') {
                            totalExpense2026 += amt;
                        }
                    });
                }

                // 2. Loan Records Mapping
                loanGivenRecords = [];
                loanTakenRecords = [];
                loanGivenTotal = 0;
                loanTakenTotal = 0;

                if (dbData.loan_records) {
                    dbData.loan_records.forEach(item => {
                        if (item.loan_category === 'Receivable') {
                            loanGivenRecords.push({
                                id: item.id,
                                date: item.entry_date,
                                person: item.person_name,
                                amount: Number(item.amount),
                                returned: item.is_returned,
                                returnDate: item.return_date || '',
                                extraFee: Number(item.extra_fee_or_charge || 0)
                            });
                            if (!item.is_returned) loanGivenTotal += Number(item.amount);
                        } else {
                            loanTakenRecords.push({
                                id: item.id,
                                date: item.entry_date,
                                person: item.person_name,
                                amount: Number(item.amount),
                                returned: item.is_returned,
                                returnDate: item.return_date || '',
                                extraCharge: Number(item.extra_fee_or_charge || 0)
                            });
                            if (!item.is_returned) loanTakenTotal += Number(item.amount);
                        }
                    });
                }

                updateFinancialDisplays();
                showToast('ডাটাবেজ থেকে সফলভাবে ডেটা লোড হয়েছে!');
            } else {
                showToast('ডাটাবেজ থেকে ডেটা আনতে সমস্যা হয়েছে।');
            }
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = text;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 3500);
        }

        function hideToast() { document.getElementById('toast').classList.add('hidden'); }
        function formatMoney(amount) { return '৳ ' + Number(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

        function updateFinancialDisplays() {
            document.getElementById('walletBalanceText').innerText = formatMoney(currentWalletBalance);
            document.getElementById('totalIncome2026').innerText = formatMoney(totalIncome2026);
            document.getElementById('totalExpense2026').innerText = formatMoney(totalExpense2026);
            document.getElementById('totalSurplus2026').innerText = formatMoney(totalIncome2026 - totalExpense2026);

            renderLoanLists();
            renderExpenseList();
        }

        function renderLoanLists() {
            const givenContainer = document.getElementById('loanGivenList');
            const takenContainer = document.getElementById('loanTakenList');
            if (givenContainer) {
                givenContainer.innerHTML = loanGivenRecords.map((item) => `
                    <div class="flex items-center justify-between text-xs bg-[#131822] px-2.5 py-2 rounded-lg border border-slate-800/70">
                        <div>
                            <span class="text-slate-200 font-semibold block">${item.person}</span>
                            <span class="text-[10px] text-slate-500">Given: ${item.date}</span>
                        </div>
                        <span class="text-emerald-400 font-bold">৳ ${Number(item.amount).toLocaleString()}</span>
                    </div>
                `).join('') || '<p class="text-slate-500 text-center py-1">কোনো রেকর্ড নেই</p>';
            }
            if (takenContainer) {
                takenContainer.innerHTML = loanTakenRecords.map((item) => `
                    <div class="flex items-center justify-between text-xs bg-[#131822] px-2.5 py-2 rounded-lg border border-slate-800/70">
                        <div>
                            <span class="text-slate-200 font-semibold block">${item.person}</span>
                            <span class="text-[10px] text-slate-500">Date: ${item.date}</span>
                        </div>
                        <span class="text-rose-400 font-bold">৳ ${Number(item.amount).toLocaleString()}</span>
                    </div>
                `).join('') || '<p class="text-slate-500 text-center py-1">কোনো রেকর্ড নেই</p>';
            }
            document.getElementById('loanGivenTotalText').innerText = `Total: ৳ ${loanGivenTotal.toLocaleString()}`;
            document.getElementById('loanTakenTotalText').innerText = `Total: ৳ ${loanTakenTotal.toLocaleString()}`;
        }

        function renderExpenseList() {
            const tbody = document.getElementById('marketExpenseList');
            if (!tbody) return;
            tbody.innerHTML = marketExpenses.map(exp => `
                <tr class="hover:bg-slate-800/30">
                    <td class="py-2 px-2 text-slate-400 text-[11px]">${exp.date}</td>
                    <td class="py-2 px-2 text-slate-200">${exp.desc}</td>
                    <td class="py-2 px-2 text-rose-400 font-semibold">৳ ${Number(exp.amount).toLocaleString()}</td>
                    <td class="py-2 px-2 text-right">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${exp.status === 'Paid' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">${exp.status}</span>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="4" class="py-2 text-center text-slate-500">কোনো খরচ নেই</td></tr>';
        }

        // --- মূল লগইন এবং ডাটা সিঙ্ক ফাংশন ---
        async function handleMainSignIn(event) {
            event.preventDefault();
            const inputVal = document.getElementById('mainUserId').value.trim();
            const passwordVal = document.getElementById('mainUserPassword').value.trim();
            const companyId = document.getElementById('signInCompanyId').value;
            
            if(!inputVal) return;

            GLOBAL_COMPANY_ID = companyId;
            currentUserId = inputVal.length <= 4 ? inputVal.padStart(4, '0') : inputVal.slice(-4);
            currentCompositeUserId = `${companyId}_${currentUserId}`;

            showToast('লগইন যাচাই করা হচ্ছে...');
            const result = await callServerProxy('LOGIN', { password: passwordVal });
            
            if (result.success && result.user) {
                currentWalletBalance = Number(result.user.wallet_balance || 0);
                currentValidityDays = Number(result.user.validity_days || 0);
                
                document.getElementById('currentLoggedInUser').innerText = currentUserId;
                document.getElementById('displayCompositeId').innerText = currentCompositeUserId;
                document.getElementById('accountValidityDays').innerText = currentValidityDays;
                
                document.getElementById('page1').classList.add('hidden');
                document.getElementById('page2').classList.remove('hidden');
                
                // ডাইরেক্ট ডাটাবেজ থেকে ডাটা ফেচ করে রেন্ডার করা
                await fetchDashboardDataFromDB();
            } else {
                console.error("Login Failed Response:", result);
                showToast(result.message || 'ইউজার পাওয়া যায়নি! সঠিক আইডি দিন।');
            }
        }

        async function handleLogOut() {
            document.getElementById('page2').classList.add('hidden');
            document.getElementById('page1').classList.remove('hidden');
            showToast('Logged out successfully');
        }

        async function handleIncomeSubmit(event) {
            event.preventDefault();
            const entryType = document.getElementById('incomeEntryType').value;
            const date = document.getElementById('incomeDate').value;
            const desc = document.getElementById('incomeDesc').value;
            const amount = parseFloat(document.getElementById('incomeAmount').value) || 0;
            
            await callServerProxy('ADD_INCOME_EXPENSE', { entry_type: entryType, entry_date: date, description: desc, amount: amount });
            closeIncomeModal();
            await fetchDashboardDataFromDB();
        }

        async function handleMarketSubmit(event) {
            event.preventDefault();
            const date = document.getElementById('marketDate').value;
            const desc = document.getElementById('marketDesc').value;
            const amount = parseFloat(document.getElementById('marketAmount').value) || 0;
            const status = document.getElementById('marketStatus').value;

            await callServerProxy('ADD_DAILY_EXPENSE', { expense_date: date, description: desc, amount: amount, status: status });
            if (status === 'Due') {
                await callServerProxy('ADD_LOAN', { loan_category: 'Payable', entry_date: date, person_name: desc, amount: amount });
            }
            closeMarketModal();
            await fetchDashboardDataFromDB();
        }

        async function handleLoanSubmit(event) {
            event.preventDefault();
            const category = document.getElementById('loanType').value;
            const date = document.getElementById('loanDate').value;
            const person = document.getElementById('loanPersonName').value;
            const amount = parseFloat(document.getElementById('loanAmount').value) || 0;

            await callServerProxy('ADD_LOAN', { loan_category: category, entry_date: date, person_name: person, amount: amount });
            closeLoanModal();
            await fetchDashboardDataFromDB();
        }

        function openIncomeModal() { document.getElementById('incomeModal').classList.remove('hidden'); }
        function closeIncomeModal() { document.getElementById('incomeModal').classList.add('hidden'); }
        function openLoanModal() { document.getElementById('loanModal').classList.remove('hidden'); }
        function closeLoanModal() { document.getElementById('loanModal').classList.add('hidden'); }
        function openMarketModal() { document.getElementById('marketModal').classList.remove('hidden'); }
        function closeMarketModal() { document.getElementById('marketModal').classList.add('hidden'); }
        function toggleAccountsSection() {
            const container = document.getElementById('accountsSectionContainer');
            container.classList.toggle('hidden');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            if(document.getElementById('marketDate')) document.getElementById('marketDate').value = today;
            if(document.getElementById('incomeDate')) document.getElementById('incomeDate').value = today;
            if(document.getElementById('loanDate')) document.getElementById('loanDate').value = today;
        });
    </script>

</html>
