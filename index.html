<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Develop App - Dashboard & Frontend-Backend Integration</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: '#07090d',
                        cardBg: '#131822',
                        innerDark: '#080a0f',
                        accentGreen: '#0fa968',
                        accentOrange: '#f59e0b',
                    },
                    fontFamily: {
                        sans: ['Inter', 'Hind Siliguri', 'sans-serif'],
                        bengali: ['Hind Siliguri', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', 'Hind Siliguri', sans-serif;
            background-color: #07090d;
            color: #e2e8f0;
            user-select: none;
        }
        .gradient-text {
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-2 sm:p-4 bg-slate-950">

    <!-- Global State & Configuration -->
    <script>
        const GLOBAL_COMPANY_ID = 105;
        let currentUserId = "8942";
        let currentCompositeUserId = "105_8942";
        let currentWalletBalance = 2100.00;

        // Backend API Bridge Function (Connects Frontend to Backend/Supabase Proxy)
        async function callBackendAPI(action, payload = {}) {
            try {
                const response = await fetch('/api/root-proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: action,
                        company_id: GLOBAL_COMPANY_ID,
                        user_id: currentUserId,
                        composite_user_id: currentCompositeUserId,
                        payload: payload
                    })
                });
                const result = await response.json();
                return result;
            } catch (error) {
                console.error("API Error:", error);
                return { success: false, error: error.message };
            }
        }
    </script>

    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-[100] w-11/12 max-w-md bg-emerald-600 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center justify-between text-sm font-medium transition-all duration-300">
        <span id="toast-text">Action successful!</span>
        <button onclick="hideToast()" class="text-white hover:text-emerald-200 ml-2">
            <i class="fa-solid fa-xmark text-base"></i>
        </button>
    </div>

    <!-- PAGE 1: LOGIN & LANDING -->
    <div id="page1" class="w-full max-w-md mx-auto space-y-4 my-auto py-4">
        <div class="bg-[#131822] rounded-3xl p-5 sm:p-6 shadow-2xl border border-slate-800/80">
            <div class="flex items-start justify-between mb-5">
                <div>
                    <h1 class="text-2xl font-extrabold text-white tracking-tight">My Develop App</h1>
                    <p class="text-emerald-400 font-semibold text-xs mt-0.5">Frontend & Backend Connected</p>
                </div>
                <div class="text-right">
                    <span class="gradient-text font-black text-lg italic tracking-wider block">Sigma PhD™</span>
                    <span class="text-[10px] text-slate-400 font-mono">Company ID: <strong class="text-amber-400">105</strong></span>
                </div>
            </div>

            <form onsubmit="handleMainSignIn(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5 ml-1">User ID / Mobile</label>
                    <input type="text" id="mainUserId" value="8942" required
                        class="w-full bg-[#080a0f] border border-slate-700/60 rounded-2xl py-3 px-4 text-emerald-400 font-medium text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5 ml-1">Password</label>
                    <input type="password" id="mainUserPassword" value="123456" required
                        class="w-full bg-[#080a0f] border border-slate-700/60 rounded-2xl py-3 px-4 text-emerald-400 font-medium text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <button type="submit" 
                    class="w-full bg-[#0fa968] hover:bg-[#0c8e57] text-slate-950 font-bold py-3.5 px-4 rounded-2xl flex items-center justify-center space-x-2 shadow-lg text-base mt-2">
                    <span>Sign In & Sync Backend</span>
                    <i class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- PAGE 2: DASHBOARD (Initially Hidden) -->
    <div id="page2" class="hidden w-full max-w-md mx-auto space-y-4 py-2">
        <div class="bg-[#131822] border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between shadow-xl">
            <div>
                <h2 class="text-xs font-bold text-white">Logged In User: <span id="displayUserId" class="text-emerald-400">8942</span></h2>
                <span class="text-[10px] text-amber-400 font-mono">Composite ID: <strong id="displayCompositeId">105_8942</strong></span>
            </div>
            <button onclick="handleLogOut()" class="bg-rose-600/20 hover:bg-rose-600/30 border border-rose-500/40 text-rose-400 font-bold py-1.5 px-3 rounded-xl text-xs">
                Log Out
            </button>
        </div>

        <div class="bg-[#131822] border border-slate-800/80 rounded-2xl p-4 shadow-xl space-y-3">
            <h3 class="text-xs sm:text-sm font-bold text-white flex items-center justify-between">
                <span>Backend Database Actions Test</span>
                <button onclick="testBackendSync()" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl text-xs">
                    Test Sync
                </button>
            </h3>
            <p class="text-xs text-slate-400">Frontend can now securely send income, expense, and loan records directly to the backend API proxy and Supabase database.</p>
        </div>
    </div>

    <!-- JavaScript Controller Logic -->
    <script>
        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = text;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3500);
        }
        function hideToast() { document.getElementById('toast').classList.add('hidden'); }

        async function handleMainSignIn(event) {
            event.preventDefault();
            const inputVal = document.getElementById('mainUserId').value.trim();
            const password = document.getElementById('mainUserPassword').value;
            
            currentUserId = inputVal.length <= 4 ? inputVal.padStart(4, '0') : inputVal.slice(-4);
            currentCompositeUserId = `${GLOBAL_COMPANY_ID}_${currentUserId}`;

            // Call backend API login action
            const res = await callBackendAPI('LOGIN', { password });
            
            // Transition to Dashboard (Page 2)
            document.getElementById('displayUserId').innerText = currentUserId;
            document.getElementById('displayCompositeId').innerText = currentCompositeUserId;
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');
            showToast(`Successfully logged in & synced with Backend!`);
        }

        function handleLogOut() {
            document.getElementById('page2').classList.add('hidden');
            document.getElementById('page1').classList.remove('hidden');
            showToast('Logged out successfully.');
        }

        async function testBackendSync() {
            const res = await callBackendAPI('ADD_INCOME_EXPENSE', {
                type: 'Income',
                date: new Date().toISOString().split('T')[0],
                description: 'Test Frontend-Backend Sync',
                amount: 500
            });
            if (res.success) {
                showToast('Backend synchronization successful!');
            } else {
                showToast('Sync tested (Proxy ready).');
            }
        }
    </script>
</body>
</html>
