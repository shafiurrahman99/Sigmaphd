<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma PhD™ - Sign In</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Single Debit/Credit Card Formatted Sign-In Container (Dark -> Medium -> Dark Gradient) -->
    <div class="w-full max-w-md rounded-3xl bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-950 text-white shadow-2xl border border-indigo-500/30 p-6 sm:p-8 relative overflow-hidden">
        
        <!-- Subtle Background Glows -->
        <div class="w-56 h-56 rounded-full bg-indigo-600/20 blur-3xl absolute -right-14 -top-14 pointer-events-none"></div>
        <div class="w-48 h-48 rounded-full bg-cyan-400/10 blur-3xl absolute -left-14 -bottom-14 pointer-events-none"></div>

        <!-- Card Top Right Corner Brand: Sigma PhD™ with 3-Color Gradual Gradient -->
        <div class="flex justify-end mb-6 relative z-10">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight inline-flex items-start">
                <span class="bg-gradient-to-r from-cyan-300 via-indigo-300 to-fuchsia-400 bg-clip-text text-transparent">
                    Sigma PhD
                </span>
                <sup class="text-[10px] font-bold text-fuchsia-300 ml-0.5 mt-1.5 tracking-wider">TM</sup>
            </h1>
        </div>

        <!-- Sign In Form Inside the Card -->
        <div class="relative z-10">
            <!-- Status Message Box -->
            <div id="statusMessage" class="hidden mb-4 p-3 rounded-xl text-xs font-medium transition-all"></div>

            <!-- 1. Sign In View (Default) -->
            <form id="signInForm" class="space-y-4" novalidate>
                <!-- User ID -->
                <div>
                    <input 
                        type="text" 
                        id="userId" 
                        name="userId" 
                        placeholder="Enter User ID"
                        aria-label="Enter User ID"
                        required
                        autocomplete="username"
                        class="w-full px-4 py-3 rounded-xl border border-white/15 bg-white/10 text-white placeholder-slate-300/70 text-sm focus:outline-none focus:bg-white/15 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/30 transition-all"
                    >
                </div>

                <!-- Password -->
                <div class="relative">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter Password"
                        aria-label="Enter Password"
                        required
                        autocomplete="current-password"
                        class="w-full px-4 py-3 pr-11 rounded-xl border border-white/15 bg-white/10 text-white placeholder-slate-300/70 text-sm focus:outline-none focus:bg-white/15 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/30 transition-all"
                    >
                    <button 
                        type="button" 
                        id="togglePassword" 
                        aria-label="Show password"
                        class="absolute inset-y-0 right-0 px-3.5 flex items-center text-slate-300 hover:text-white focus:outline-none cursor-pointer"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>

                <!-- Bottom 3-Column Action Row: Sign In | Forgot Password | Register New -->
                <div class="pt-2 grid grid-cols-3 items-center gap-2">
                    <div class="text-left">
                        <button 
                            type="submit" 
                            class="w-full bg-gradient-to-r from-indigo-600 via-indigo-500 to-purple-600 hover:from-indigo-500 hover:to-purple-500 active:scale-[0.99] text-white font-semibold py-2.5 px-3 rounded-xl shadow-lg shadow-slate-950/60 transition-all duration-150 cursor-pointer text-xs sm:text-sm tracking-wide"
                        >
                            Sign In
                        </button>
                    </div>

                    <div class="text-center">
                        <button 
                            type="button" 
                            id="forgotPasswordBtn"
                            class="text-[11px] sm:text-xs font-medium text-slate-300 hover:text-cyan-300 transition-colors cursor-pointer"
                        >
                            Forgot Password
                        </button>
                    </div>

                    <div class="text-right">
                        <button 
                            type="button" 
                            id="registerNewBtn"
                            class="text-[11px] sm:text-xs font-medium text-indigo-300 hover:text-fuchsia-300 transition-colors cursor-pointer"
                        >
                            Register New
                        </button>
                    </div>
                </div>
            </form>

            <!-- 2. Register New View (Includes Company ID + Composite User ID) -->
            <form id="registerForm" class="hidden space-y-3" novalidate>
                <div class="grid grid-cols-2 gap-2.5">
                    <input 
                        type="text" 
                        id="regCompanyId" 
                        placeholder="Company ID"
                        aria-label="Company ID"
                        required
                        class="w-full px-3.5 py-2.5 rounded-xl border border-white/15 bg-white/10 text-white placeholder-slate-300/70 text-xs sm:text-sm focus:outline-none focus:bg-white/15 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/30 transition-all"
                    >
                    <input 
                        type="text" 
                        id="regUserId" 
                        placeholder="User ID"
                        aria-label="User ID"
                        required
                        class="w-full px-3.5 py-2.5 rounded-xl border border-white/15 bg-white/10 text-white placeholder-slate-300/70 text-xs sm:text-sm focus:outline-none focus:bg-white/15 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/30 transition-all"
                    >
                </div>

                <div>
                    <input 
                        type="text" 
                        id="regFullName" 
                        placeholder="Full Name"
                        aria-label="Full Name"
                        required
                        class="w-full px-3.5 py-2.5 rounded-xl border border-white/15 bg-white/10 text-white placeholder-slate-300/70 text-xs sm:text-sm focus:outline-none focus:bg-white/15 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/30 transition-all"
                    >
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <input 
                        type="email" 
                        id="regEmail" 
                        placeholder="Email Address"
                        aria-label="Email Address"
                        required
                        class="w-full px-3.5 py-2.5 rounded-xl border border-white/15 bg-white/10 text-white placeholder-slate-300/70 text-xs sm:text-sm focus:outline-none focus:bg-white/15 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/30 transition-all"
                    >
                    <input 
                        type="password" 
                        id="regPassword" 
                        placeholder="Create Password"
                        aria-label="Create Password"
                        required
                        class="w-full px-3.5 py-2.5 rounded-xl border border-white/15 bg-white/10 text-white placeholder-slate-300/70 text-xs sm:text-sm focus:outline-none focus:bg-white/15 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/30 transition-all"
                    >
                </div>

                <div class="pt-1 flex items-center justify-between gap-3">
                    <button 
                        type="submit" 
                        id="regSubmitBtn"
                        class="w-full bg-gradient-to-r from-indigo-600 via-indigo-500 to-purple-600 hover:from-indigo-500 hover:to-purple-500 active:scale-[0.99] text-white font-semibold py-2.5 px-5 rounded-xl shadow-lg shadow-slate-950/60 transition-all duration-150 cursor-pointer text-xs sm:text-sm"
                    >
                        Register
                    </button>
                    <button 
                        type="button" 
                        id="simulateApproveBtn"
                        class="hidden shrink-0 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-200 border border-emerald-400/30 font-medium py-2.5 px-3 rounded-xl transition-all cursor-pointer text-[11px]"
                        title="Simulate Admin Approval"
                    >
                        Approve (Demo)
                    </button>
                    <button 
                        type="button" 
                        data-back-signin
                        class="shrink-0 text-xs font-medium text-slate-300 hover:text-cyan-300 transition-colors cursor-pointer pl-1"
                    >
                        &larr; Sign In
                    </button>
                </div>
            </form>

            <!-- 3. Forgot Password View -->
            <form id="forgotForm" class="hidden space-y-4" novalidate>
                <div>
                    <input 
                        type="text" 
                        id="forgotUserId" 
                        placeholder="Enter User ID"
                        aria-label="Enter User ID"
                        required
                        class="w-full px-4 py-3 rounded-xl border border-white/15 bg-white/10 text-white placeholder-slate-300/70 text-sm focus:outline-none focus:bg-white/15 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/30 transition-all"
                    >
                </div>

                <div class="pt-1 flex items-center justify-between gap-3">
                    <button 
                        type="submit" 
                        class="bg-gradient-to-r from-indigo-600 via-indigo-500 to-purple-600 hover:from-indigo-500 hover:to-purple-500 active:scale-[0.99] text-white font-semibold py-2.5 px-5 rounded-xl shadow-lg shadow-slate-950/60 transition-all duration-150 cursor-pointer text-xs sm:text-sm"
                    >
                        Send Reset Code
                    </button>
                    <button 
                        type="button" 
                        data-back-signin
                        class="text-xs font-medium text-slate-300 hover:text-cyan-300 transition-colors cursor-pointer"
                    >
                        &larr; Back to Sign In
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Client-Side Application Logic -->
    <script>
        <script src="script.js"></script>
    </script>
</body>
</html>
