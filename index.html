
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma PhD™ - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-200 min-h-screen flex items-center justify-center p-4 antialiased">

    <!-- Single Debit/Credit Card Formatted Sign-In Container (Dark -> Medium -> Dark Gradient) -->
    <div class="w-full max-w-md rounded-3xl bg-gradient-to-br from-slate-950 via-indigo-900 to-slate-950 text-white shadow-2xl border border-indigo-400/20 p-6 sm:p-8 relative overflow-hidden">
        
        <!-- Subtle Background Glows -->
        <div class="w-56 h-56 rounded-full bg-indigo-500/20 blur-2xl absolute -right-14 -top-14 pointer-events-none"></div>
        <div class="w-48 h-48 rounded-full bg-cyan-400/10 blur-2xl absolute -left-14 -bottom-14 pointer-events-none"></div>

        <!-- Card Top Right Corner Brand: Sigma PhD™ with 3-Color Gradual Gradient -->
        <div class="flex justify-end mb-6 relative z-10">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight inline-flex items-start">
                <span class="bg-gradient-to-r from-cyan-300 via-indigo-300 to-fuchsia-400 bg-clip-text text-transparent">
                    Sigma PhD
                </span>
                <sup class="text-[10px] font-bold text-fuchsia-300 ml-0.5 mt-1.5 tracking-wider">TM</sup>
            </h1>
        </div>

        <!-- Sign In Form Inside the Card -->
        <div class="relative z-10">
            <!-- Status Message Box -->
            <div id="statusMessage" class="hidden mb-4 p-3 rounded-xl text-xs font-medium"></div>

            <form id="signInForm" class="space-y-4" novalidate>
                <!-- User ID -->
                <div>
                    <input 
                        type="text" 
                        id="userId" 
                        name="userId" 
                        placeholder="Enter User ID"
                        aria-label="Enter User ID"
                        required
                        autocomplete="username"
                        class="w-full px-4 py-3 rounded-xl border border-white/15 bg-white/10 text-white placeholder-slate-300/70 text-sm focus:outline-none focus:bg-white/15 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/30 transition-all"
                    >
                </div>

                <!-- Password -->
                <div class="relative">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter Password"
                        aria-label="Enter Password"
                        required
                        autocomplete="current-password"
                        class="w-full px-4 py-3 pr-11 rounded-xl border border-white/15 bg-white/10 text-white placeholder-slate-300/70 text-sm focus:outline-none focus:bg-white/15 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/30 transition-all"
                    >
                    <button 
                        type="button" 
                        id="togglePassword" 
                        aria-label="Show password"
                        class="absolute inset-y-0 right-0 px-3.5 flex items-center text-slate-300 hover:text-white focus:outline-none cursor-pointer"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>

                <!-- Bottom 3-Column Action Row: Sign In | Forgot Password | Register New -->
                <div class="pt-2 grid grid-cols-3 items-center gap-2">
                    <div class="text-left">
                        <button 
                            type="submit" 
                            class="w-full bg-gradient-to-r from-indigo-600 via-indigo-500 to-purple-600 hover:from-indigo-500 hover:to-purple-500 active:scale-[0.99] text-white font-semibold py-2.5 px-3 rounded-xl shadow-lg shadow-slate-950/60 transition-all duration-150 cursor-pointer text-xs sm:text-sm tracking-wide"
                        >
                            Sign In
                        </button>
                    </div>

                    <div class="text-center">
                        <button 
                            type="button" 
                            id="forgotPasswordBtn"
                            class="text-[11px] sm:text-xs font-medium text-slate-300 hover:text-cyan-300 transition-colors cursor-pointer"
                        >
                            Forgot Password
                        </button>
                    </div>

                    <div class="text-right">
                        <button 
                            type="button" 
                            id="registerNewBtn"
                            class="text-[11px] sm:text-xs font-medium text-indigo-300 hover:text-fuchsia-300 transition-colors cursor-pointer"
                        >
                            Register New
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const signInForm = document.getElementById('signInForm');
            const userIdInput = document.getElementById('userId');
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
            const registerNewBtn = document.getElementById('registerNewBtn');
            const statusMessage = document.getElementById('statusMessage');

            const showStatus = (text, isError = false) => {
                statusMessage.classList.remove(
                    'hidden',
                    'bg-rose-500/20', 'text-rose-200', 'border', 'border-rose-400/30',
                    'bg-emerald-500/20', 'text-emerald-200', 'border-emerald-400/30',
                    'bg-indigo-500/20', 'text-indigo-200', 'border-indigo-400/30'
                );
                statusMessage.textContent = text;
                if (isError) {
                    statusMessage.classList.add('bg-rose-500/20', 'text-rose-200', 'border', 'border-rose-400/30');
                } else {
                    statusMessage.classList.add('bg-emerald-500/20', 'text-emerald-200', 'border', 'border-emerald-400/30');
                }
            };

            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                togglePasswordBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
            });

            forgotPasswordBtn.addEventListener('click', () => {
                showStatus('Password recovery option selected.');
            });

            registerNewBtn.addEventListener('click', () => {
                showStatus('New account registration selected.');
            });

            signInForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const userId = userIdInput.value.trim();
                const password = passwordInput.value.trim();

                if (!userId || !password) {
                    showStatus('Please enter both User ID and Password.', true);
                    return;
                }

                showStatus(`Signing in as "${userId}"...`);
            });
        });
    </script>
</body>
</html>
