<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Sigma PhD - User Dashboard (user.html)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style id="dynamicStyleContainer"></style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-4xl bg-slate-900 border border-amber-500/50 rounded-3xl p-6 shadow-2xl space-y-4">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-base font-extrabold text-amber-400"><i class="fa-solid fa-wallet mr-2"></i>Tier 4: End-User Personal Dashboard</h1>
                <p class="text-[11px] text-slate-400">Composite ID: <strong class="text-emerald-400">105_8942</strong> | Universal Balance in BDT</p>
            </div>
            <button onclick="logoutUser()" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl shadow">Log Out</button>
        </div>

        <div class="bg-gradient-to-r from-emerald-900 to-teal-900 border border-emerald-500/40 rounded-2xl p-4 flex justify-between items-center shadow-xl text-xs">
            <div>
                <span class="text-emerald-200 block">Universal Balance (BDT):</span>
                <span class="text-2xl font-black text-white font-mono">৳ 2,100.00</span>
            </div>
            <div class="flex space-x-2">
                <button class="px-3 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow">Add Balance</button>
                <button class="px-3 py-2 bg-white hover:bg-slate-100 text-slate-950 font-bold rounded-xl shadow">P2P Transfer</button>
            </div>
        </div>
    </div>

    <script>
        function logoutUser() {
            window.location.href = 'user.html';
        }
    </script>
</body>
</html>
